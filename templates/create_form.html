{% extends "base.html" %}

{% block title %}Create Form - Admin{% endblock %}

{% block content %}
<div class="container">
    <div class="form-container">
        <h1>Create New Form</h1>
        
        <form method="POST" class="submission-form">
            <div class="form-group">
                <label for="title">Form Title: <span class="required">*</span></label>
                <input type="text" id="title" name="title" required placeholder="e.g., Parent Consent Form 2025">
            </div>

            <div class="form-group">
                <label for="description">Description:</label>
                <textarea id="description" name="description" rows="4" placeholder="Describe what this form is for and what information parents need to provide..."></textarea>
            </div>

            <div class="form-group">
                <label for="deadline">Deadline: <span class="required">*</span></label>
                <input type="datetime-local" id="deadline" name="deadline" required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">Create Form</button>
                <a href="{{ url_for('admin_dashboard') }}" class="btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
